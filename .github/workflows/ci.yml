name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Format and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format source
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets
      - name: Build release binary
        run: cargo build --release
      - name: Create Windows launcher script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path target/release/Start-Minecraft-Rust.bat -Encoding ASCII -Value '@echo off', 'cd /d "%~dp0"', 'minecraft-rust.exe --window', 'if errorlevel 1 pause'
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-rust-windows-x64
          path: |
            target/release/minecraft-rust.exe
            target/release/Start-Minecraft-Rust.bat
          if-no-files-found: error
      - name: Upload Linux binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-rust-linux-x64
          path: target/release/minecraft-rust
          if-no-files-found: error
