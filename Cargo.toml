[package]
name = "minecraft-rust-edition"
version = "0.1.0"
edition = "2021"
description = "Independent Rust implementation foundation for Minecraft Java 1.8.9"
license = "MIT"

[lib]
name = "minecraft_rust"
path = "src/lib.rs"

[[bin]]
name = "minecraft-rust"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
resolver = "2"
