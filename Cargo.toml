[package]
name = "minecraft-rust-edition"
version = "0.1.0"
edition = "2021"
description = "Independent Rust implementation foundation for Minecraft Java 1.8.9"
license = "MIT"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.17"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[lib]
name = "minecraft_rust"
path = "src/lib.rs"

[[bin]]
name = "minecraft-rust"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
resolver = "2"
