[package]
name = "rust-edition-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rust-edition-launcher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
